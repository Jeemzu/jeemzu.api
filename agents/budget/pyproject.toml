[project]
name = "jeemzu-budget"
version = "0.1.0"
description = "Budgetize assistant — answers budget questions and proposes reviewable schedule changes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.4",
    "langchain-openai>=0.3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
