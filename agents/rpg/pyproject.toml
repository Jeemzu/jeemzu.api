[project]
name = "jeemzu-rpg"
version = "0.1.0"
description = "Multi-agent RPG orchestration service — AI Game Master for multiplayer dungeon crawling"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-openai>=0.3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
