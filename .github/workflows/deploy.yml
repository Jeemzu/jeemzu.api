name: Notify frontend of API changes

# Render builds and deploys both services straight from this repo on push to main
# (see render.yaml), so CI only has to tell the frontend to regenerate its API types.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch api-types-update to jeemzu.me
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.FRONTEND_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Jeemzu/jeemzu.me/dispatches \
            -d '{"event_type":"api-types-update"}'
