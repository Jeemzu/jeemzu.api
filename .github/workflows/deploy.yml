name: Build and deploy container

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: jeemzuregistry.azurecr.io
  IMAGE_NAME: jeemzu-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set environment tag
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.tag }}

      - name: Notify frontend of API changes
        if: github.ref_name == 'main'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.FRONTEND_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Jeemzu/jeemzu.me/dispatches \
            -d '{"event_type":"api-types-update"}'
