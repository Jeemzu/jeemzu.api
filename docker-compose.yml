services:
  postgres:
    image: postgres:16-alpine
    container_name: jeemzu_postgres
    environment:
      POSTGRES_USER: jeemzu
      POSTGRES_PASSWORD: jeemzu_dev_password
      POSTGRES_DB: jeemzu_db
    ports:
      - "5432:5432"
    volumes:
      - jeemzu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jeemzu -d jeemzu_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: jeemzu_agents
    ports:
      - "8001:8000"
    env_file:
      - ./agents/.env
    environment:
      DOTNET_API_URL: http://host.docker.internal:5000/api
    depends_on:
      - postgres

volumes:
  jeemzu_pgdata:
