services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jeemzu_postgres
    environment:
      POSTGRES_USER: jeemzu
      POSTGRES_PASSWORD: jeemzu_dev_password
      POSTGRES_DB: jeemzu_db
    ports:
      - "5432:5432"
    volumes:
      - jeemzu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jeemzu -d jeemzu_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: jeemzu_agents
    ports:
      - "8001:8000"
    env_file:
      - ./agents/.env
    environment:
      DOTNET_API_URL: http://host.docker.internal:5050/api
    volumes:
      - ./agents:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres

  rpg:
    build:
      context: ./agents/rpg
      dockerfile: Dockerfile
    container_name: jeemzu_rpg
    ports:
      - "8002:8002"
    env_file:
      - ./agents/rpg/.env
    environment:
      DOTNET_API_URL: http://host.docker.internal:5050/api
    volumes:
      - ./agents/rpg:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    depends_on:
      - postgres

  budget:
    build:
      context: ./agents/budget
      dockerfile: Dockerfile
    container_name: jeemzu_budget
    ports:
      - "8003:8003"
    env_file:
      - ./agents/budget/.env
    environment:
      DOTNET_API_URL: http://host.docker.internal:5050/api
    volumes:
      - ./agents/budget:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload

volumes:
  jeemzu_pgdata:
